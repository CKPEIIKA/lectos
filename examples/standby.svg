<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <!-- A 16:9 television test card; the message is part of the picture. -->
  <defs>
    <pattern id="grid" width="48" height="36" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v36" fill="none" stroke="#788174" stroke-width="1"/>
    </pattern>
    <clipPath id="picture"><rect x="30" y="30" width="900" height="480"/></clipPath>
  </defs>
  <rect width="960" height="540" fill="#242820"/>
  <rect x="20" y="20" width="920" height="500" fill="#d7ceb5"/>
  <g clip-path="url(#picture)">
    <rect x="30" y="30" width="900" height="480" fill="#b6bba5"/>
    <rect x="30" y="30" width="900" height="480" fill="url(#grid)"/>
    <circle cx="480" cy="270" r="205" fill="#d9deca" stroke="#39463c" stroke-width="8"/>
    <circle cx="480" cy="270" r="180" fill="none" stroke="#7c8978" stroke-width="3"/>
    <path d="M480 58v424M260 270h440" stroke="#8a9685" stroke-width="3"/>
    <path d="M30 30h900v42H30zM30 468h900v42H30z" fill="#343e35"/>
    <path d="M48 48h130m604 0h130M48 492h130m604 0h130" stroke="#e5dfc9" stroke-width="5"/>
    <g transform="translate(192 116)">
      <rect width="72" height="66" fill="#e7e0c8"/><rect x="72" width="72" height="66" fill="#ddbd64"/>
      <rect x="144" width="72" height="66" fill="#9fbda2"/><rect x="216" width="72" height="66" fill="#6f9b78"/>
      <rect x="288" width="72" height="66" fill="#729fa1"/><rect x="360" width="72" height="66" fill="#827c96"/>
      <rect x="432" width="72" height="66" fill="#b6806a"/><rect x="504" width="72" height="66" fill="#374b43"/>
    </g>
    <rect x="158" y="213" width="644" height="114" fill="#27372e" stroke="#e9e0c6" stroke-width="6"/>
    <text x="480" y="285" text-anchor="middle" fill="#f5e9c9" font-family="monospace" font-size="54" font-weight="bold" letter-spacing="3">PLEASE STAND BY</text>
    <g transform="translate(240 364)">
      <rect width="60" height="42" fill="#1e2822"/><rect x="60" width="60" height="42" fill="#414c42"/>
      <rect x="120" width="60" height="42" fill="#667265"/><rect x="180" width="60" height="42" fill="#899486"/>
      <rect x="240" width="60" height="42" fill="#aab5a3"/><rect x="300" width="60" height="42" fill="#c4cdbc"/>
      <rect x="360" width="60" height="42" fill="#dbe1ce"/><rect x="420" width="60" height="42" fill="#f2efdf"/>
    </g>
    <path d="M90 225v90m-30-45h60m750-45v90m-30-45h60" stroke="#39463c" stroke-width="5"/>
  </g>
  <rect x="30" y="30" width="900" height="480" fill="none" stroke="#39463c" stroke-width="6"/>
</svg>
