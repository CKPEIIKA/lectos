[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lectos"
version = "0.1.0"
description = "Presenter console that drives Zathura from Markdown lecture notes."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = []

[project.scripts]
lectos = "lectos.cli:main"
lectos-tui = "lectos.cli:main_tui"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "ty",
]
audit = [
  "vulture",
]

[tool.uv]
required-version = ">=0.9.8"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["lectos", "tests"]
exclude = ["build", "dist", "refs"]

# GTK/Poppler bindings are typeless GObject introspection, resolved at runtime only.
[[tool.ty.overrides]]
include = ["lectos/gtk/*.py", "tests/gtk/*.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow' --cov"
markers = [
  "integration: tests that cross process or external-system boundaries",
  "slow: tests excluded from the normal fast development loop",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
  ".git",
  ".venv",
  ".uv-cache",
  "build",
  "dist",
  "refs",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C90",
  "PLR",
  "RUF",
]
ignore = [
  "PLR0913",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-branches = 7
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# Expected literals are the point of an assertion, so PLR2004 is ignored in tests.
"tests/**/*.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"scripts/**/*.py" = ["C901", "PLR0912", "PLR0915"]

# gi.require_version must run before the gi.repository imports, so E402 is ignored in the GTK modules.
"lectos/gtk/*.py" = ["E402"]
"tests/gtk/*.py" = ["E402"]
# The Unicode math table deliberately contains Greek letters and operators that resemble ASCII.
"lectos/notes/unimath.py" = ["RUF001"]
# The i18n tests assert on Russian text.
"tests/test_i18n.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["lectos"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# Type-checking-only imports never run. Every other exclusion must be narrow and explained here.
exclude_also = ["if TYPE_CHECKING:"]
